---
# Full serial-container provisioning still needs target acceptance.
- name: Set up a Raspberry Pi to run the Russound web interface in Docker
  hosts: musicpi
  become: true
  vars:
    deploy_user: "{{ ansible_user | default('musicpi') }}"
    app_dir: "/home/{{ ansible_user | default('musicpi') }}/MPDRussoundPi"
    repo_url: https://github.com/itcorner/MPDRussoundPi.git
    repo_version: main
    russound_publish_port: 8000
    russound_serial_device: /dev/ttyUSB0
    russound_serial_options: 19200n81
    russound_ser2net_bind: 0.0.0.0
    russound_manage_serial_gateway: true
    # Defaults to the ser2net container of the stack; override when using an external gateway.
    russound_backend_host: russound-ser2net
    russound_backend_port: 6666
    russound_debug: false
    russound_playback_agents: []
    russound_verify_backend: false
    russound_use_published_images: false
    russound_published_pull_policy: always
    russound_web_image: ""
    russound_ser2net_image: ""
    russound_registry_override_dir: "/home/{{ ansible_user | default('musicpi') }}/.config/mpdrussoundpi-deploy"
    ansible_python_interpreter: /usr/bin/python3

  tasks:
    - name: Require an explicit external endpoint when not managing the serial gateway
      ansible.builtin.assert:
        that:
          - >-
            russound_manage_serial_gateway | bool or
            (russound_backend_host is string and russound_backend_host | trim | length > 0 and
             russound_backend_host == (russound_backend_host | trim) and russound_backend_host != 'russound-ser2net')
        fail_msg: "Set russound_backend_host to a nonblank existing gateway host without surrounding whitespace when russound_manage_serial_gateway=false."

    - name: Require explicit published image references
      ansible.builtin.assert:
        that:
          - >-
            not (russound_use_published_images | bool) or
            (russound_web_image is string and russound_web_image | trim | length > 0 and
             russound_web_image == (russound_web_image | trim))
          - >-
            not (russound_use_published_images | bool) or not (russound_manage_serial_gateway | bool) or
            (russound_ser2net_image is string and russound_ser2net_image | trim | length > 0 and
             russound_ser2net_image == (russound_ser2net_image | trim))
          - russound_published_pull_policy in ['always', 'missing', 'never']
        fail_msg: "Set nonblank web and managed serial gateway image references without surrounding whitespace when using published images."

    - name: Check whether the serial device is present
      ansible.builtin.stat:
        path: "{{ russound_serial_device }}"
      register: serial_device
      when: russound_manage_serial_gateway | bool

    - name: Require the serial device before changing services
      ansible.builtin.assert:
        that:
          - serial_device.stat.exists
          - serial_device.stat.ischr | default(false)
        fail_msg: "{{ russound_serial_device }} is not a present character device. Attach the adapter before deployment."
      when: russound_manage_serial_gateway | bool

    - name: Install base packages
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - git
        state: present
        update_cache: true

    - name: Ensure apt keyring directory exists
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Add Docker GPG key
      ansible.builtin.get_url:
        url: "https://download.docker.com/linux/{{ ansible_distribution | lower }}/gpg"
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Detect dpkg architecture
      ansible.builtin.command: dpkg --print-architecture
      register: dpkg_architecture
      changed_when: false

    - name: Add Docker apt repository
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/docker.list
        content: >-
          deb [arch={{ dpkg_architecture.stdout }} signed-by=/etc/apt/keyrings/docker.asc]
          https://download.docker.com/linux/{{ ansible_distribution | lower }}
          {{ ansible_distribution_release }} stable

        mode: "0644"

    - name: Install Docker Engine and the Compose plugin
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: true

    - name: Enable and start Docker
      ansible.builtin.systemd:
        name: docker
        enabled: true
        state: started

    - name: Add the deployment user to the docker group
      ansible.builtin.user:
        name: "{{ deploy_user }}"
        groups: docker
        append: true

    - name: Gather service facts
      ansible.builtin.service_facts:

    # ser2net now runs in its own container and would otherwise hold the serial port and TCP port.
    - name: Disable the host ser2net service
      ansible.builtin.systemd:
        name: ser2net
        enabled: false
        state: stopped
      when:
        - russound_manage_serial_gateway | bool
        - "'ser2net.service' in ansible_facts.services"

    - name: Disable the non-container russound-web service
      ansible.builtin.systemd:
        name: russound-web
        enabled: false
        state: stopped
      when: "'russound-web.service' in ansible_facts.services"

    - name: Ensure the checkout directory belongs to the deployment user
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        owner: "{{ deploy_user }}"
        group: "{{ deploy_user }}"
        mode: "0755"

    - name: Clone or update the repository
      become_user: "{{ deploy_user }}"
      ansible.builtin.git:
        repo: "{{ repo_url }}"
        dest: "{{ app_dir }}"
        version: "{{ repo_version }}"
        force: false
        update: true

    - name: Ensure the repository is owned by the deployment user
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        owner: "{{ deploy_user }}"
        group: "{{ deploy_user }}"
        recurse: true

    - name: Ensure the bind-mounted directories exist
      ansible.builtin.file:
        path: "{{ app_dir }}/docker/{{ item }}"
        state: directory
        owner: "{{ deploy_user }}"
        group: "{{ deploy_user }}"
        mode: "0755"
      loop:
        - config
        - data
        - logs

    - name: Create the private playback secret directory without copying credentials
      ansible.builtin.file:
        path: "{{ app_dir }}/docker/secrets"
        state: directory
        owner: "{{ deploy_user }}"
        group: "{{ deploy_user }}"
        mode: "0700"

    - name: Seed the configuration file when it does not exist yet
      ansible.builtin.copy:
        src: "{{ app_dir }}/web/config_example.json"
        dest: "{{ app_dir }}/docker/config/russound_config.json"
        remote_src: true
        owner: "{{ deploy_user }}"
        group: "{{ deploy_user }}"
        mode: "0644"
        force: false

    - name: Look up the deployment user account
      ansible.builtin.getent:
        database: passwd
        key: "{{ deploy_user }}"

    - name: Look up the dialout group
      ansible.builtin.getent:
        database: group
        key: dialout
      when: russound_manage_serial_gateway | bool

    - name: Resolve container user and serial device ids
      ansible.builtin.set_fact:
        russound_uid: "{{ ansible_facts.getent_passwd[deploy_user][1] }}"
        russound_gid: "{{ ansible_facts.getent_passwd[deploy_user][2] }}"
        russound_serial_gid: "{{ serial_device.stat.gid if russound_manage_serial_gateway | bool else 20 }}"

    - name: Write the compose environment file
      ansible.builtin.template:
        src: ../templates/russound-docker.env.j2
        dest: "{{ app_dir }}/.env"
        owner: "{{ deploy_user }}"
        group: "{{ deploy_user }}"
        mode: "0640"
      no_log: true
      diff: false

    - name: Create the published image override directory
      ansible.builtin.file:
        path: "{{ russound_registry_override_dir }}"
        state: directory
        owner: "{{ deploy_user }}"
        group: "{{ deploy_user }}"
        mode: "0700"
      when: russound_use_published_images | bool

    - name: Write the published image compose override
      ansible.builtin.template:
        src: ../templates/russound-registry-compose.yml.j2
        dest: "{{ russound_registry_override_dir }}/docker-compose.yml"
        owner: "{{ deploy_user }}"
        group: "{{ deploy_user }}"
        mode: "0600"
      when: russound_use_published_images | bool

    - name: Pull and start the published containers
      ansible.builtin.command:
        argv: >-
          {{
            ['docker', 'compose', '--project-directory', app_dir,
             '-f', app_dir + '/docker-compose.yml',
             '-f', russound_registry_override_dir + '/docker-compose.yml',
             'up', '-d', '--pull', russound_published_pull_policy, '--no-build'] +
            ([] if russound_manage_serial_gateway | bool else ['--no-deps', 'russound-web'])
          }}
        chdir: "{{ app_dir }}"
      register: registry_compose_up
      changed_when: "'Started' in registry_compose_up.stderr or 'Created' in registry_compose_up.stderr or 'Recreated' in registry_compose_up.stderr or 'Pulled' in registry_compose_up.stderr"
      when: russound_use_published_images | bool

    - name: Build and start the containers
      ansible.builtin.command:
        cmd: "docker compose -f docker-compose.yml up -d --build {{ '' if russound_manage_serial_gateway | bool else '--no-deps russound-web' }}"
        chdir: "{{ app_dir }}"
      register: compose_up
      changed_when: "'Started' in compose_up.stderr or 'Created' in compose_up.stderr or 'Recreated' in compose_up.stderr"
      when: not (russound_use_published_images | bool)

    - name: Wait for the web interface to answer
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ russound_publish_port }}/"
        status_code: 200
      register: web_check
      retries: 30
      delay: 2
      until: web_check.status == 200

    - name: Verify the Russound controller responds
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ russound_publish_port }}/api/rooms"
        status_code: 200
      register: russound_backend_check
      retries: 12
      delay: 5
      until: russound_backend_check.json.backend_status.connected | default(false)
      when: russound_verify_backend | bool

    - name: Report the service address
      ansible.builtin.debug:
        msg: "Russound web interface is available on http://{{ ansible_host | default(inventory_hostname) }}:{{ russound_publish_port }}/"
