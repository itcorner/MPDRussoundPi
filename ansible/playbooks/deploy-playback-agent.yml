---
- name: Stage a revision-pinned playback-agent candidate without activation
  hosts: musicpi
  become: false
  pre_tasks:
    - name: Validate playback agent inputs
      ansible.builtin.import_role:
        name: ../roles/deployment_inputs
        defaults_from: agent
      tags: always

    - name: Require explicit revision-pinned agent candidate staging
      ansible.builtin.assert:
        that:
          - playback_agent_mode == 'stage'
          - playback_agent_revision is match('^[a-f0-9]{40,64}$')
          - playback_agent_repo == 'https://github.com/itcorner/MPDRussoundPi.git'
          - playback_agent_candidate_root == ansible_facts['user_dir'] + '/.local/share/mpdrussoundpi/agent-candidates'
          - ansible_facts['system'] == 'Linux'
          - ansible_facts['user_uid'] | int > 0
          - not (playback_agent_start | bool)
          - not ansible_check_mode
          - "'stage' in ansible_run_tags"
          - ansible_run_tags | difference(['all', 'stage']) | length == 0
        fail_msg: >-
          This play supports only --tags stage for a full, immutable commit from the
          approved repository. Active agent deployment and credential rotation require
          the reviewed native transaction and recovery workflow.
        quiet: true
      tags: always

    - name: Inspect agent candidate revision path without following symlinks
      ansible.builtin.stat:
        path: "{{ playback_agent_candidate_root }}/{{ playback_agent_revision }}"
        follow: false
      register: playback_agent_candidate
      tags: always

    - name: Inspect candidate storage root without following symlinks
      ansible.builtin.stat:
        path: "{{ playback_agent_candidate_root }}"
        follow: false
      register: playback_agent_candidate_root_stat
      tags: always

    - name: Inspect persistent operational audio configuration without following symlinks
      ansible.builtin.stat:
        path: "{{ playback_agent_config }}"
        follow: false
      register: playback_agent_operational_config
      tags: always

    - name: Refuse an existing candidate or unsafe configuration path
      ansible.builtin.assert:
        that:
          - not (playback_agent_candidate.stat.exists | default(false))
          - not (playback_agent_candidate_root_stat.stat.islnk | default(false))
          - >-
            not (playback_agent_candidate_root_stat.stat.exists | default(false)) or
            ((playback_agent_candidate_root_stat.stat.isdir | default(false)) and
             playback_agent_candidate_root_stat.stat.uid | default(-1) == ansible_facts['user_uid'] | int and
             playback_agent_candidate_root_stat.stat.mode | default('') == '0700')
          - >-
            not (playback_agent_operational_config.stat.exists | default(false)) or
            ((playback_agent_operational_config.stat.isreg | default(false)) and
             not (playback_agent_operational_config.stat.islnk | default(false)) and
             playback_agent_operational_config.stat.uid | default(-1) == ansible_facts['user_uid'] | int)
        fail_msg: "Candidate already exists or the configuration path is not a user-owned regular file; inspect before proceeding."
        quiet: true
      tags: always

  tasks:
    - name: Create private agent candidate storage
      ansible.builtin.file:
        path: "{{ playback_agent_candidate_root }}"
        state: directory
        mode: "0700"
      tags: stage

    - name: Atomically reserve the new agent candidate revision path
      ansible.builtin.command:
        argv:
          - /usr/bin/mkdir
          - -m
          - "0700"
          - --
          - "{{ playback_agent_candidate_root }}/{{ playback_agent_revision }}"
      changed_when: true
      tags: stage

    - name: Clone the exact agent candidate commit outside the active installation
      ansible.builtin.git:
        repo: "{{ playback_agent_repo }}"
        dest: "{{ playback_agent_candidate_root }}/{{ playback_agent_revision }}/source"
        version: "{{ playback_agent_revision }}"
        update: false
        force: false
      tags: stage

    - name: Create an isolated agent candidate virtual environment
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - -m
          - venv
          - "{{ playback_agent_candidate_root }}/{{ playback_agent_revision }}/venv"
      tags: stage

    # Editable: the venv runs the code of this candidate's own immutable checkout.
    - name: Install the candidate package with only its bounded agent dependencies
      ansible.builtin.pip:
        name: "{{ playback_agent_candidate_root }}/{{ playback_agent_revision }}/source[agent]"
        editable: true
        virtualenv: "{{ playback_agent_candidate_root }}/{{ playback_agent_revision }}/venv"
      tags: stage

    - name: Verify the candidate's agent command starts
      ansible.builtin.command:
        argv: ["{{ playback_agent_candidate_root }}/{{ playback_agent_revision }}/venv/bin/playback-agent", --help]
      environment:
        PYTHONDONTWRITEBYTECODE: "1"
      changed_when: false
      tags: stage

    - name: Verify the staged source is clean
      ansible.builtin.command:
        argv:
          - /usr/bin/git
          - -C
          - "{{ playback_agent_candidate_root }}/{{ playback_agent_revision }}/source"
          - status
          - --porcelain=v1
          - --untracked-files=all
      register: playback_agent_candidate_status
      changed_when: false
      tags: stage

    - name: Verify the agent candidate revision
      ansible.builtin.command:
        argv:
          - /usr/bin/git
          - -C
          - "{{ playback_agent_candidate_root }}/{{ playback_agent_revision }}/source"
          - rev-parse
          - HEAD
      register: playback_agent_candidate_head
      changed_when: false
      failed_when: >-
        playback_agent_candidate_status.stdout | trim != '' or
        playback_agent_candidate_head.stdout | trim != playback_agent_revision
      tags: stage

    - name: Validate existing playback configuration with candidate code without contacting MPD or audio
      ansible.builtin.command:
        argv:
          - "{{ playback_agent_candidate_root }}/{{ playback_agent_revision }}/venv/bin/python"
          - -c
          - >-
            import sys;
            from mpdrussoundpi.russound.lib.mpdbackend import MPDBackend;
            backend = MPDBackend(sys.argv[1]);
            print(len(backend.list_outputs()))
          - "{{ playback_agent_config }}"
      environment:
        PYTHONDONTWRITEBYTECODE: "1"
      register: playback_agent_config_validation
      changed_when: false
      when: playback_agent_operational_config.stat.exists
      no_log: true
      tags: stage

    - name: Report staged candidate without activating services or installing credentials
      ansible.builtin.debug:
        msg:
          revision: "{{ playback_agent_revision }}"
          source: "{{ playback_agent_candidate_root }}/{{ playback_agent_revision }}/source"
          environment: "{{ playback_agent_candidate_root }}/{{ playback_agent_revision }}/venv"
          config_outputs_validated: "{{ playback_agent_config_validation.stdout | default('operational config not present') }}"
          activation: not-performed
          credentials: untouched
          services: untouched
      tags: stage
