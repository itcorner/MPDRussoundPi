---
- name: Stage a revision-pinned native web candidate without activation
  hosts: musicpi
  become: true
  pre_tasks:
    - name: Validate native web staging inputs
      ansible.builtin.import_role:
        name: ../roles/deployment_inputs
        defaults_from: web_stage
      tags: always

    - name: Resolve deployment account paths and group
      ansible.builtin.include_role:
        name: ../roles/deployment_account
        apply:
          tags: always
      tags: always

    - name: Record deployment account numeric identity
      ansible.builtin.set_fact:
        deploy_uid: "{{ ansible_facts.getent_passwd[deploy_user][1] | int }}"
      changed_when: false
      tags: always

    - name: Require Linux, the selected deployment account and an explicit candidate revision
      ansible.builtin.assert:
        that:
          - ansible_facts['system'] == 'Linux'
          - deploy_uid | int > 0
          - russound_web_revision is match('^[a-f0-9]{40,64}$')
          - repo_url == 'https://github.com/itcorner/MPDRussoundPi.git'
          - russound_web_candidate_root == deploy_home + '/.local/share/russound-web/candidates'
          - not ansible_check_mode
          - "'stage' in ansible_run_tags"
          - ansible_run_tags | difference(['all', 'stage']) | length == 0
        fail_msg: >-
          This entry point supports only --tags stage for a full commit from the
          approved repository. Native web activation remains behind the reviewed
          transaction and recovery workflow.
        quiet: true
      tags: always

    - name: Inspect the exact web candidate path without following symlinks
      ansible.builtin.stat:
        path: "{{ russound_web_candidate_root }}/{{ russound_web_revision }}"
        follow: false
      register: russound_web_candidate
      become_user: "{{ deploy_user }}"
      tags: always

    - name: Inspect the web candidate root without following symlinks
      ansible.builtin.stat:
        path: "{{ russound_web_candidate_root }}"
        follow: false
      register: russound_web_candidate_root_stat
      become_user: "{{ deploy_user }}"
      tags: always

    - name: Inspect the persistent web configuration without following symlinks
      ansible.builtin.stat:
        path: "{{ russound_config_file }}"
        follow: false
      register: russound_web_config
      become_user: "{{ deploy_user }}"
      tags: always

    - name: Refuse candidate reuse or unsafe configuration and storage paths
      ansible.builtin.assert:
        that:
          - not (russound_web_candidate.stat.exists | default(false))
          - not (russound_web_candidate.stat.islnk | default(false))
          - not (russound_web_candidate_root_stat.stat.islnk | default(false))
          - >-
            not (russound_web_candidate_root_stat.stat.exists | default(false)) or
            ((russound_web_candidate_root_stat.stat.isdir | default(false)) and
             russound_web_candidate_root_stat.stat.uid | default(-1) == deploy_uid | int and
             russound_web_candidate_root_stat.stat.mode | default('') == '0700')
          - >-
            not (russound_web_config.stat.exists | default(false)) or
            ((russound_web_config.stat.isreg | default(false)) and
             not (russound_web_config.stat.islnk | default(false)) and
             russound_web_config.stat.uid | default(-1) == deploy_uid | int and
             russound_web_config.stat.mode[2] not in ['2', '3', '6', '7'] and
             russound_web_config.stat.mode[3] not in ['2', '3', '6', '7'])
        fail_msg: "Candidate already exists or web configuration/storage is not privately owned; inspect before proceeding."
        quiet: true
      tags: always

  tasks:
    - name: Create private native web candidate storage
      ansible.builtin.file:
        path: "{{ russound_web_candidate_root }}"
        state: directory
        owner: "{{ deploy_user }}"
        group: "{{ deploy_group }}"
        mode: "0700"
      tags: stage

    - name: Atomically reserve the new native web candidate revision path
      ansible.builtin.command:
        argv:
          - /usr/bin/mkdir
          - -m
          - "0700"
          - --
          - "{{ russound_web_candidate_root }}/{{ russound_web_revision }}"
      changed_when: true
      become_user: "{{ deploy_user }}"
      tags: stage

    - name: Clone the exact native web candidate commit outside the active checkout
      ansible.builtin.git:
        repo: "{{ repo_url }}"
        dest: "{{ russound_web_candidate_root }}/{{ russound_web_revision }}/source"
        version: "{{ russound_web_revision }}"
        update: false
        force: false
      become_user: "{{ deploy_user }}"
      tags: stage

    - name: Create an isolated native web candidate virtual environment
      ansible.builtin.command:
        argv:
          - "{{ ansible_python_interpreter }}"
          - -m
          - venv
          - "{{ russound_web_candidate_root }}/{{ russound_web_revision }}/venv"
      become_user: "{{ deploy_user }}"
      tags: stage

    - name: Install bounded native web dependencies into the candidate environment
      ansible.builtin.pip:
        requirements: "{{ russound_web_candidate_root }}/{{ russound_web_revision }}/source/web/requirements.txt"
        virtualenv: "{{ russound_web_candidate_root }}/{{ russound_web_revision }}/venv"
      become_user: "{{ deploy_user }}"
      tags: stage

    - name: Verify the staged source is clean
      ansible.builtin.command:
        argv:
          - /usr/bin/git
          - -C
          - "{{ russound_web_candidate_root }}/{{ russound_web_revision }}/source"
          - status
          - --porcelain=v1
          - --untracked-files=all
      register: russound_web_candidate_status
      changed_when: false
      become_user: "{{ deploy_user }}"
      tags: stage

    - name: Verify the native web candidate revision
      ansible.builtin.command:
        argv:
          - /usr/bin/git
          - -C
          - "{{ russound_web_candidate_root }}/{{ russound_web_revision }}/source"
          - rev-parse
          - HEAD
      register: russound_web_candidate_head
      changed_when: false
      failed_when: >-
        russound_web_candidate_status.stdout | trim != '' or
        russound_web_candidate_head.stdout | trim != russound_web_revision
      become_user: "{{ deploy_user }}"
      tags: stage

    - name: Compile candidate web modules without writing bytecode into the checkout
      ansible.builtin.command:
        argv:
          - "{{ russound_web_candidate_root }}/{{ russound_web_revision }}/venv/bin/python"
          - -c
          - >-
            import sys;
            from pathlib import Path;
            root=Path(sys.argv[1]);
            [compile(path.read_bytes(),str(path),'exec') for path in root.rglob('*.py')]
          - "{{ russound_web_candidate_root }}/{{ russound_web_revision }}/source/web"
      environment:
        PYTHONDONTWRITEBYTECODE: "1"
      changed_when: false
      become_user: "{{ deploy_user }}"
      tags: stage

    - name: Validate existing native web configuration with candidate code
      ansible.builtin.command:
        argv:
          - "{{ russound_web_candidate_root }}/{{ russound_web_revision }}/venv/bin/python"
          - -c
          - >-
            import json,sys;
            from pathlib import Path;
            sys.path.insert(0,sys.argv[1]);
            from web.config_types import validate_russound_config;
            validate_russound_config(json.loads(Path(sys.argv[2]).read_text(encoding='utf-8')));
            print('valid')
          - "{{ russound_web_candidate_root }}/{{ russound_web_revision }}/source"
          - "{{ russound_config_file }}"
      environment:
        PYTHONDONTWRITEBYTECODE: "1"
      register: russound_web_config_validation
      changed_when: false
      when: russound_web_config.stat.exists
      no_log: true
      become_user: "{{ deploy_user }}"
      tags: stage

    - name: Report staged native web candidate without activating services
      ansible.builtin.debug:
        msg:
          revision: "{{ russound_web_revision }}"
          source: "{{ russound_web_candidate_root }}/{{ russound_web_revision }}/source"
          environment: "{{ russound_web_candidate_root }}/{{ russound_web_revision }}/venv"
          config_validated: "{{ russound_web_config_validation.stdout | default('operational config not present') }}"
          activation: not-performed
          services: untouched
      tags: stage
