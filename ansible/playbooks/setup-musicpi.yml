---
- hosts: musicpi
  pre_tasks:
    - name: Validate playback host inputs
      ansible.builtin.import_role:
        name: ../roles/deployment_inputs
        defaults_from: audio
      tags: always
    - name: Require immutable candidate identity and explicit supported mode
      ansible.builtin.assert:
        that:
          - mpd_russoundpi_mode in ['stage', 'activate']
          - mpd_russoundpi_mode != 'stage' or mpd_russoundpi_revision is match('^[a-f0-9]{40,64}$')
          - mpd_russoundpi_mode != 'activate'
          - mpd_russoundpi_mode != 'stage' or 'stage' in ansible_run_tags
          - ansible_run_tags | difference(['all', 'stage']) | length == 0
        fail_msg: >-
          setup-musicpi.yml currently supports only isolated staging. Activate a candidate
          only through a separately reviewed native transaction with verified recovery backup;
          this legacy in-place activation path is intentionally disabled.
        quiet: true
      tags: always
    - name: Inspect immutable audio candidate path
      ansible.builtin.stat:
        path: "{{ mpd_russoundpi_candidate_root }}/{{ mpd_russoundpi_revision }}"
        follow: false
      register: mpd_audio_candidate
      when: mpd_russoundpi_mode == 'stage'
      tags: always
    - name: Inspect candidate storage root without following a symlink
      ansible.builtin.stat:
        path: "{{ mpd_russoundpi_candidate_root }}"
        follow: false
      register: mpd_audio_candidate_root
      when: mpd_russoundpi_mode == 'stage'
      tags: always
    - name: Inspect persistent operational audio configuration
      ansible.builtin.stat:
        path: "{{ mpd_russoundpi_config }}"
      register: mpd_audio_operational_config
      when: mpd_russoundpi_mode == 'stage'
      tags: always
    - name: Refuse to reuse a pre-existing candidate path without inspection
      ansible.builtin.assert:
        that:
          - not (mpd_audio_candidate.stat.exists | default(false))
          - not (mpd_audio_candidate.stat.islnk | default(false))
          - not (mpd_audio_candidate_root.stat.islnk | default(false))
          - >-
            not (mpd_audio_candidate_root.stat.exists | default(false)) or
            ((mpd_audio_candidate_root.stat.isdir | default(false)) and
             mpd_audio_candidate_root.stat.uid | default(-1) == ansible_facts['user_uid'] | int and
             mpd_audio_candidate_root.stat.mode | default('') == '0700')
          - >-
            mpd_russoundpi_candidate_root ==
            ansible_facts['user_dir'] + '/.local/share/mpdrussoundpi/audio-candidates'
        fail_msg: "Candidate revision path already exists; inspect it and select a fresh, reviewed staging path."
        quiet: true
      when: mpd_russoundpi_mode == 'stage'
      tags: always
  tasks:
    - name: Create private immutable audio candidate parent
      ansible.builtin.file:
        path: "{{ mpd_russoundpi_candidate_root }}"
        state: directory
        mode: "0700"
      when: mpd_russoundpi_mode == 'stage'
      tags: stage

    - name: Atomically reserve the new private audio candidate revision path
      ansible.builtin.command:
        argv:
          - /usr/bin/mkdir
          - -m
          - "0700"
          - --
          - "{{ mpd_russoundpi_candidate_root }}/{{ mpd_russoundpi_revision }}"
      changed_when: true
      when: mpd_russoundpi_mode == 'stage'
      tags: stage

    - name: Clone the exact audio candidate commit without touching the active checkout
      ansible.builtin.git:
        repo: "{{ mpd_russoundpi_repo }}"
        dest: "{{ mpd_russoundpi_candidate_root }}/{{ mpd_russoundpi_revision }}/source"
        version: "{{ mpd_russoundpi_revision }}"
        update: false
        force: false
      when: mpd_russoundpi_mode == 'stage'
      tags: stage

    - name: Create an isolated audio candidate virtual environment
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - -m
          - venv
          - "{{ mpd_russoundpi_candidate_root }}/{{ mpd_russoundpi_revision }}/venv"
        creates: "{{ mpd_russoundpi_candidate_root }}/{{ mpd_russoundpi_revision }}/venv/bin/python"
      when: mpd_russoundpi_mode == 'stage'
      tags: stage

    # Editable: the venv runs the code of this candidate's own immutable checkout.
    - name: Install the candidate package with only its bounded audio dependencies
      ansible.builtin.pip:
        name: "{{ mpd_russoundpi_candidate_root }}/{{ mpd_russoundpi_revision }}/source[audio]"
        editable: true
        virtualenv: "{{ mpd_russoundpi_candidate_root }}/{{ mpd_russoundpi_revision }}/venv"
      when: mpd_russoundpi_mode == 'stage'
      tags: stage

    - name: Verify the candidate's audio commands start
      ansible.builtin.command:
        argv: ["{{ mpd_russoundpi_candidate_root }}/{{ mpd_russoundpi_revision }}/venv/bin/{{ item }}", --help]
      environment:
        PYTHONDONTWRITEBYTECODE: "1"
      loop: [mpd-setup, audio-setup, mpd-supervisor, audio-ready]
      changed_when: false
      when: mpd_russoundpi_mode == 'stage'
      tags: stage

    - name: Verify the staged source revision and clean checkout
      ansible.builtin.command:
        argv:
          - /usr/bin/git
          - -C
          - "{{ mpd_russoundpi_candidate_root }}/{{ mpd_russoundpi_revision }}/source"
          - status
          - --porcelain=v1
          - --untracked-files=all
      register: mpd_audio_candidate_status
      changed_when: false
      when: mpd_russoundpi_mode == 'stage'
      tags: stage

    - name: Verify the candidate checkout has the selected exact commit
      ansible.builtin.command:
        argv:
          - /usr/bin/git
          - -C
          - "{{ mpd_russoundpi_candidate_root }}/{{ mpd_russoundpi_revision }}/source"
          - rev-parse
          - HEAD
      register: mpd_audio_candidate_head
      changed_when: false
      failed_when: >-
        mpd_audio_candidate_status.stdout | trim != '' or
        mpd_audio_candidate_head.stdout | trim != mpd_russoundpi_revision
      when: mpd_russoundpi_mode == 'stage'
      tags: stage

    - name: Validate the existing operational audio config against candidate code
      ansible.builtin.command:
        argv:
          - "{{ mpd_russoundpi_candidate_root }}/{{ mpd_russoundpi_revision }}/venv/bin/python"
          - -c
          - >-
            import pathlib,sys;
            from mpdrussoundpi.russound.lib.outputconfig import parse_configuration;
            config=parse_configuration(pathlib.Path(sys.argv[1]).read_bytes());
            print(len(config.outputs))
          - "{{ mpd_russoundpi_config }}"
      register: mpd_audio_candidate_config
      changed_when: false
      when:
        - mpd_russoundpi_mode == 'stage'
        - mpd_audio_operational_config.stat.exists
      tags: stage

    - name: Report staged candidate without activating audio services
      ansible.builtin.debug:
        msg:
          revision: "{{ mpd_russoundpi_revision }}"
          source: "{{ mpd_russoundpi_candidate_root }}/{{ mpd_russoundpi_revision }}/source"
          environment: "{{ mpd_russoundpi_candidate_root }}/{{ mpd_russoundpi_revision }}/venv"
          config_outputs_validated: "{{ mpd_audio_candidate_config.stdout | default('operational config not present') }}"
          activation: not-performed
          services: untouched
      when: mpd_russoundpi_mode == 'stage'
      tags: stage

    - name: Upgrade OS packages only when explicitly requested
      include_tasks:
        file: ../tasks/update.yml
        apply:
          tags: update
      when: mpd_russoundpi_mode == 'activate'
      tags:
        - never
        - update

    - name: Install dependencies from apt
      become: true
      apt:
        name: "{{ item }}"
        state: present
        update_cache: true
      with_items:
        - git
        - python3
        - python3-pip
        - python3-venv
        - mpd
        - mpc
        - pipewire
        - pipewire-pulse
        - wireplumber
        - pulseaudio-utils
        - ffmpeg
      tags:
        - init
        - new
      when: mpd_russoundpi_mode == 'activate'


    - name: Install a separately selected native serial gateway
      become: true
      ansible.builtin.apt:
        name: ser2net
        state: present
      when:
        - mpd_russoundpi_mode == 'activate'
        - mpd_russoundpi_manage_serial_gateway | bool
      tags: init

    - name: Copy ser2net configuration file
      become: true
      copy:
        dest: /etc/
        src: ../../mpdrussoundpi/ser2net/ser2net.yaml
      notify: Restart ser2net
      when:
        - mpd_russoundpi_mode == 'activate'
        - mpd_russoundpi_manage_serial_gateway | bool
      tags:
        - init

    - name: Ensure ser2net is running
      become: true
      systemd:
        name: ser2net
        state: started
        enabled: yes
      when:
        - mpd_russoundpi_mode == 'activate'
        - mpd_russoundpi_manage_serial_gateway | bool
      tags:
        - init

    - name: Prepare the isolated playback virtual environment
      block:
        - name: Ensure the virtual environment exists
          ansible.builtin.command:
            argv: [/usr/bin/python3, -m, venv, "{{ venv_dir }}"]
            creates: "{{ venv_dir }}/bin/python"
      tags:
        - init
        - new
      when: mpd_russoundpi_mode == 'activate'

    - name: Clone/update MPDRussoundPi Repository
      ansible.builtin.git:
        repo: "{{ mpd_russoundpi_repo }}"
        dest: "{{ mpd_russoundpi_dest }}"
        update: true
      when:
        - mpd_russoundpi_mode == 'activate'
        - mpd_russoundpi_update_repo | bool
      tags:
        - new

    - name: Install the checkout package with its bounded audio dependencies
      ansible.builtin.pip:
        name: "{{ mpd_russoundpi_dest }}[audio]"
        editable: true
        virtualenv: "{{ venv_dir }}"
      when: mpd_russoundpi_mode == 'activate'
      tags:
        - init
        - new

    - name: Run MPD setup scripts
      block:
        - name: Allow headless access to sound devices without a seat session
          become: true
          ansible.builtin.user:
            name: "{{ ansible_facts['user_id'] }}"
            groups: audio
            append: true

        - name: Disable the distribution-wide MPD daemon
          become: true
          ansible.builtin.systemd_service:
            name: mpd.service
            enabled: false
            state: stopped

        - name: Enable lingering for the audio user
          become: true
          ansible.builtin.command:
            argv: [loginctl, enable-linger, "{{ ansible_facts['user_id'] }}"]
            creates: "/var/lib/systemd/linger/{{ ansible_facts['user_id'] }}"

        - name: Start the persistent user manager
          become: true
          ansible.builtin.systemd_service:
            name: "user@{{ ansible_facts['user_uid'] }}.service"
            state: started

        - name: Create persistent audio configuration directory
          ansible.builtin.file:
            path: "{{ mpd_russoundpi_config | dirname }}"
            state: directory
            mode: "0700"

        - name: Seed persistent configuration without overwriting calibrated gains
          ansible.builtin.copy:
            src: "{{ mpd_russoundpi_scripts }}/config.json"
            dest: "{{ mpd_russoundpi_config }}"
            remote_src: true
            force: false
            mode: "0600"

        - name: Retire the legacy automatic controller if present
          ansible.builtin.stat:
            path: "{{ ansible_facts['user_dir'] }}/.config/systemd/user/auto-mpd-control.service"
          register: legacy_controller

        - name: Disable obsolete automatic controller
          ansible.builtin.systemd_service:
            name: auto-mpd-control.service
            scope: user
            enabled: false
            state: stopped
          when: legacy_controller.stat.exists

        - name: Enable and start the user audio services
          ansible.builtin.systemd_service:
            name: "{{ item }}"
            scope: user
            enabled: true
            state: started
          loop: [pipewire.socket, pipewire-pulse.socket, pipewire.service, wireplumber.service, pipewire-pulse.service]

        - name: Stop playback reconciliation while regenerating configuration
          ansible.builtin.stat:
            path: "{{ ansible_facts['user_dir'] }}/.config/systemd/user/mpd_playback_supervisor.service"
          register: existing_supervisor

        - name: Stop existing supervisor during deployment
          ansible.builtin.systemd_service:
            name: mpd_playback_supervisor.service
            scope: user
            state: stopped
          when: existing_supervisor.stat.exists

        - name: Stop configured MPD services when staging without playback
          ansible.builtin.command:
            argv: ["{{ venv_dir }}/bin/mpd-setup", --stop, "{{ mpd_russoundpi_config }}"]
          when: not (mpd_russoundpi_start_playback | bool)

        - name: Setup audio system
          ansible.builtin.command:
            argv: ["{{ venv_dir }}/bin/audio-setup", --install, --audio-processor, pipewire, "{{ mpd_russoundpi_config }}"]
        - name: Setup MPD services
          ansible.builtin.command:
            argv: ["{{ venv_dir }}/bin/mpd-setup", --install, "{{ mpd_russoundpi_config }}"]

        - name: Initialize missing runtime state from optional station and gain defaults
          ansible.builtin.command:
            argv: ["{{ venv_dir }}/bin/mpd-supervisor", --initialize, "{{ mpd_russoundpi_config }}"]

        - name: Set MPD meta service activation according to deployment mode
          ansible.builtin.systemd_service:
            name: mpd_meta_control.service
            scope: user
            daemon_reload: true
            enabled: "{{ mpd_russoundpi_start_playback | bool }}"
            state: "{{ 'started' if mpd_russoundpi_start_playback | bool else 'stopped' }}"

        - name: Restart configured MPD instances
          ansible.builtin.command:
            argv: ["{{ venv_dir }}/bin/mpd-setup", --restart, "{{ mpd_russoundpi_config }}"]
          when: mpd_russoundpi_start_playback | bool

        - name: Verify restored playback, routes and gains before enabling supervision
          ansible.builtin.command:
            argv: ["{{ venv_dir }}/bin/mpd-supervisor", --once, "{{ mpd_russoundpi_config }}"]
          register: playback_verification
          retries: 3
          delay: 5
          until: playback_verification.rc == 0
          when: mpd_russoundpi_start_playback | bool

        - name: Set playback reconciliation activation according to deployment mode
          ansible.builtin.systemd_service:
            name: mpd_playback_supervisor.service
            scope: user
            enabled: "{{ mpd_russoundpi_start_playback | bool }}"
            state: "{{ 'started' if mpd_russoundpi_start_playback | bool else 'stopped' }}"
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts['user_uid'] }}"
        DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ ansible_facts['user_uid'] }}/bus"
      tags:
        - new
      when: mpd_russoundpi_mode == 'activate'

  handlers:
    - name: Restart ser2net
      become: true
      systemd:
        name: ser2net
        state: restarted
