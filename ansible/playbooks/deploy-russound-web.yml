---
- name: Refuse the retired in-place native web installer
  hosts: musicpi
  become: false
  gather_facts: false
  pre_tasks:
    - name: Validate native web inputs
      ansible.builtin.import_role:
        name: ../roles/deployment_inputs
        defaults_from: web
      tags: always
  tasks:
    - name: Require reviewed native candidate activation and recovery
      ansible.builtin.fail:
        msg: >-
          The in-place native installer is retired. Use stage-native-deployment.yml
          and tool.deployment_operator native-deploy on a prepared Linux host.
          Docker-to-native cutover requires an explicit matching from_compose
          specification, reviewed interruption and verified off-host backup.
          See docs/documentation/container-deployment.md. No services were changed.
      tags: always
