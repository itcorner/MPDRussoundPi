---
- name: Resolve the selected deployment account rather than the SSH account
  ansible.builtin.getent:
    database: passwd
    key: "{{ deploy_user }}"

- name: Resolve the deployment account primary group
  ansible.builtin.getent:
    database: group

- name: Derive consistent account paths and group
  ansible.builtin.set_fact:
    deploy_home: "{{ ansible_facts.getent_passwd[deploy_user][4] }}"
    deploy_group: >-
      {{ ansible_facts.getent_group | dict2items
         | selectattr('value.1', 'equalto', ansible_facts.getent_passwd[deploy_user][2] | string)
         | map(attribute='key') | first }}

- name: Validate deployment account and native listener
  ansible.builtin.assert:
    that:
      - ansible_facts.getent_passwd[deploy_user][1] | int > 0
      - deploy_group in ansible_facts.getent_group
      - deploy_home is match('^/[A-Za-z0-9_./-]+$')
      - deployment_component != 'web' or (russound_host is string and russound_host | trim | length > 0)
    quiet: true

- name: Derive readiness URL from the actual native bind
  ansible.builtin.set_fact:
    russound_probe_url: >-
      http://{{ '127.0.0.1' if russound_host == '0.0.0.0' else
                '[::1]' if russound_host == '::' else
                '[' ~ russound_host ~ ']' if ':' in russound_host else russound_host }}:{{ russound_port }}/
  when: deployment_component == 'web'
