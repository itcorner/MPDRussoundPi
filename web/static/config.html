<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Russound Configuration</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main class="app-shell status-shell">
      <section class="panel system-panel">
        <div class="panel-header">
          <h1 id="configTitle">Russound configuration</h1>
          <details class="page-navigation">
            <summary class="menu-toggle"><span class="menu-icon" aria-hidden="true"><span></span><span></span><span></span></span>Menu</summary>
            <nav class="page-menu" aria-label="Page navigation">
              <a class="page-menu-link" href="/">Rooms</a>
              <a class="page-menu-link" href="/playback">Playback</a>
              <a class="page-menu-link is-active" href="/config" aria-current="page">Configuration</a>
              <a class="page-menu-link" href="/status">Status</a>
            </nav>
          </details>
        </div>
        <p id="configEditorMessage" class="config-hint" role="status" hidden></p>
        <div class="header-actions-bottom">
          <button id="saveConfigButton" class="power-button" type="button">Save configuration</button>
        </div>
      </section>

      <details id="connectionConfig" class="panel status-panel collapsible-panel">
        <summary class="collapsible-summary">
          <span class="section-title">Backend connection</span>
          <span id="backendSummaryStatus" class="backend-summary-status" data-state="unknown" role="status">Not checked yet</span>
        </summary>
        <div class="collapsible-body">
        <p id="backendConnectionStatus" class="config-hint" role="status">Not checked yet</p>
        <p id="backendOverrides" class="config-hint" hidden></p>
        <div class="setup-fields">
          <label class="field config-name-field">Connection
            <select id="backendMode"><option value="tcp">TCP gateway</option><option value="serial">Serial device</option></select>
          </label>
          <label id="backendHostField" class="field config-name-field">Gateway host
            <input id="backendHost" type="text" autocomplete="off" placeholder="192.168.1.100" />
          </label>
          <label id="backendPortField" class="field config-name-field">TCP port
            <input id="backendPort" type="number" min="1" max="65535" value="6666" />
          </label>
          <label id="backendDeviceField" class="field config-name-field" hidden>Serial device
            <input id="backendDevice" type="text" placeholder="/dev/ttyUSB0" />
          </label>
          <label id="backendBaudField" class="field config-name-field" hidden>Baud rate
            <input id="backendBaud" type="number" min="1" max="4000000" value="19200" />
          </label>
          <label class="field config-name-field">Poll interval (seconds)
            <input id="backendPollInterval" type="number" min="1" step="any" value="2" />
          </label>
        </div>
        </div>
      </details>

      <details class="panel status-panel collapsible-panel">
        <summary class="collapsible-summary">
          <span class="section-title">Controllers</span>
          <span id="controllerCountBadge" class="status-count">0 enabled</span>
        </summary>
        <div class="collapsible-body">
          <div id="controllerConfig" class="setup-controller-list"></div>
        </div>
      </details>

      <details id="sourceConfigPanel" class="panel status-panel collapsible-panel">
        <summary class="collapsible-summary">
          <span class="section-title">Inputs</span>
          <span id="sourceCountBadge" class="status-count">0 available</span>
        </summary>
        <div class="collapsible-body">
          <div id="configSources" class="config-source-list"></div>
        </div>
      </details>

      <section id="configEmptyState" class="panel status-panel" hidden>
        <article class="empty-state">
          <p class="empty-state-eyebrow">Configuration required</p>
          <h2>Russound setup</h2>
          <p id="configEmptyMessage"></p>
        </article>
      </section>

      <section id="controllerZones" class="status-grid"></section>

      <details id="shortcutConfigPanel" class="panel status-panel collapsible-panel">
        <summary class="collapsible-summary">
          <span class="section-title">Shortcuts</span>
          <span id="shortcutCountBadge" class="status-count" hidden></span>
        </summary>
        <div class="collapsible-body">
          <div id="configShortcuts"></div>
          <button id="addShortcutButton" class="power-button" type="button" title="Add shortcut">+ Add shortcut</button>
        </div>
      </details>
    </main>

    <script src="/static/config.js"></script>
  </body>
</html>
