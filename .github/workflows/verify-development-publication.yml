name: Verify development publication (no writes)

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Original failed development publication run with a completed digest journal
        type: string
        required: true

permissions:
  contents: read
  actions: read

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Validate original development run (no writes)
        id: source
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          RECOVERY_APPROVED: "true"
          GITHUB_TOKEN: ${{ github.token }}
        run: node tool/ci/recovery-source.mjs
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
          name: publication-journal
          path: ${{ runner.temp }}/evidence
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: arm64
      - name: Verify completed digests without publication or recovery writes
        env:
          PUBLICATION_SOURCE_SHA: ${{ steps.source.outputs.sha }}
          DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
          PUBLICATION_JOURNAL: ${{ runner.temp }}/evidence/publication-journal.json
        run: node tool/ci/verify-published-images.mjs
