name: Reusable validation

on:
  workflow_call:

permissions:
  contents: read

jobs:
  tests:
    name: Python and JavaScript tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Install test dependencies
        run: python -m pip install -r web/requirements.txt -r mpdrussoundpi/russound/requirements-agent.txt pyyaml
      - name: Run Python tests
        env:
          PYTHONPATH: tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Run JavaScript tests
        run: node --test tests/*.js

  container:
    name: Container (${{ matrix.arch }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Set up ARM emulation
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: arm64
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build clean local image without publishing
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/${{ matrix.arch }}
          no-cache: true
          load: true
          push: false
          tags: mpdrussoundpi-web:ci-${{ matrix.arch }}
      - name: Smoke-test the built image
        env:
          ARCH: ${{ matrix.arch }}
        run: bash tool/ci/smoke-web-image.sh "mpdrussoundpi-web:ci-$ARCH" "$ARCH"
