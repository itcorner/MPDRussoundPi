name: Images (development and build only)

# Development builds publish from develop pushes. Release candidates (vX.Y.Z-rc.N) and stable
# releases (vX.Y.Z) publish from version tags, only with RELEASE_PUBLICATION_ENABLED and after
# a required reviewer approved the "release" environment
# (docs/plans/general_new_release-channels.md, stage 1). Creating v* tags is restricted to
# administrators and they cannot be moved or deleted (repository rulesets).
on:
  push:
    branches: [develop]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      mode:
        description: Publication is disabled; only build-only is supported
        required: true
        type: choice
        options: [build-only]
      channel:
        description: Tag policy to exercise (no tag or registry image is created)
        required: true
        type: choice
        options: [development, candidate, stable]
      version:
        description: For candidate/stable, X.Y.Z-rc.N or X.Y.Z without v
        type: string
        default: ""
      check_registry:
        description: Check public Docker Hub tag inventory (read-only; fails if inaccessible)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # Per ref type: a release tag never waits behind (or is replaced by) queued develop runs.
  group: image-preparation-${{ github.ref_type }}
  cancel-in-progress: false

jobs:
  validation:
    uses: ./.github/workflows/validation.yml

  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.policy.outputs.version }}
      channel: ${{ steps.policy.outputs.channel }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Validate manual event, tag policy and source ancestry
        id: policy
        env:
          MODE: ${{ github.event_name == 'push' && (github.ref_type == 'tag' && 'prepare-release' || 'prepare-development') || inputs.mode }}
          CHANNEL: ${{ github.event_name == 'push' && 'development' || inputs.channel }}
          VERSION: ${{ github.event_name == 'push' && '' || inputs.version }}
          DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
        run: |
          if [ -z "$DOCKERHUB_NAMESPACE" ]; then
            echo 'DOCKERHUB_NAMESPACE repository variable is required' >&2
            exit 1
          fi
          node tool/ci/image-policy.mjs
      - name: Check live public inventory and write-once tags (never publish)
        if: ${{ inputs.check_registry }}
        env:
          MODE: ${{ inputs.mode }}
          CHANNEL: ${{ inputs.channel }}
          VERSION: ${{ inputs.version }}
          DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
        run: node tool/ci/registry-inventory.mjs

  changes:
    # Publish only what changed (docs/plans/general_done_publish-only-changed-images.md):
    # read-only, anonymous registry access, no secrets.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build: ${{ steps.decide.outputs.build }}
      reason: ${{ steps.decide.outputs.reason }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Decide whether the images changed since the published development images
        id: decide
        env:
          DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          # A release always publishes both images under its version.
          if [ "$REF_TYPE" = tag ]; then
            echo 'build=true' >> "$GITHUB_OUTPUT"
            echo 'reason=release tag' >> "$GITHUB_OUTPUT"
          else
            node tool/ci/image-changes.mjs
          fi

  images:
    needs: [validation, policy, changes]
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        image: [web, ser2net]
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Select Dockerfile
        id: file
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          if [ "$IMAGE" = web ]; then
            echo 'path=Dockerfile' >> "$GITHUB_OUTPUT"
          else
            echo 'path=Dockerfile.ser2net' >> "$GITHUB_OUTPUT"
          fi
      - name: Record the build time
        id: built
        run: echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Data schema versions the web image reads
        id: schema
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          # docs/plans/general_open_persisted-data-schema-version.md: the updater reads this
          # label before an update; the smoke test checks it against the code in the image.
          if [ "$IMAGE" = web ]; then
            echo "label=net.itcorner.mpdrussoundpi.data-schema=$(python3 -c 'from mpdrussoundpi.common.dataschema import label; print(label())')" >> "$GITHUB_OUTPUT"
          else
            echo "label=" >> "$GITHUB_OUTPUT"
          fi
      - name: Export OCI image locally (never push)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ steps.file.outputs.path }}
          platforms: linux/${{ matrix.arch }}
          push: false
          outputs: type=oci,dest=${{ runner.temp }}/image.tar
          tags: ${{ vars.DOCKERHUB_NAMESPACE }}/mpdrussoundpi-${{ matrix.image }}:${{ needs.policy.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/itcorner/MPDRussoundPi
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.policy.outputs.version }}
            org.opencontainers.image.created=${{ steps.built.outputs.time }}
            ${{ steps.schema.outputs.label }}
          build-args: |
            BUILD_REVISION=${{ github.sha }}
            BUILD_TIME=${{ steps.built.outputs.time }}
            BUILD_SOURCE=ci
            BUILD_IMAGE=${{ vars.DOCKERHUB_NAMESPACE }}/mpdrussoundpi-${{ matrix.image }}
            BUILD_VERSION=${{ needs.policy.outputs.version }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=prepared-${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=prepared-${{ matrix.image }}-${{ matrix.arch }}
      - name: Load the exported artifact and test it
        env:
          IMAGE: ${{ matrix.image }}
          ARCH: ${{ matrix.arch }}
          ARCHIVE: ${{ runner.temp }}/image.tar
          VERSION: ${{ needs.policy.outputs.version }}
        run: |
          node tool/ci/verify-image-archive.mjs "$ARCHIVE" "$ARCH" "$GITHUB_SHA" "$VERSION" > "$ARCHIVE.metadata.json"
          sudo apt-get update
          sudo apt-get install -y skopeo
          skopeo copy --override-arch "$ARCH" "oci-archive:$ARCHIVE" "docker-daemon:mpdrussoundpi-$IMAGE:prepared"
          if [ "$IMAGE" = web ]; then
            bash tool/ci/smoke-web-image.sh "mpdrussoundpi-$IMAGE:prepared" "$ARCH"
          else
            bash tool/ci/smoke-ser2net-image.sh "mpdrussoundpi-$IMAGE:prepared" "$ARCH"
          fi
          sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"
          {
            echo "### $IMAGE / $ARCH"
            echo 'Build-only: no registry login, push or deployment.'
            cat "$ARCHIVE.sha256"
            cat "$ARCHIVE.metadata.json"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Save tested OCI artifact with attestations
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: prepared-${{ matrix.image }}-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/image.tar
            ${{ runner.temp }}/image.tar.sha256
            ${{ runner.temp }}/image.tar.metadata.json
          retention-days: 7
          if-no-files-found: error

  publication-plan:
    needs: [policy, images]
    if: ${{ inputs.check_registry }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: image-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: prepared-*
          path: ${{ runner.temp }}/prepared
      - name: Verify tested artifacts and plan publication under serialization (no writes)
        env:
          MODE: ${{ inputs.mode }}
          CHANNEL: ${{ inputs.channel }}
          VERSION: ${{ inputs.version }}
          DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
          ARTIFACT_ROOT: ${{ runner.temp }}/prepared
        run: node tool/ci/publication-plan.mjs

  publish-development:
    needs: [policy, images]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop' && vars.DEVELOPMENT_PUBLICATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: image-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: prepared-*
          path: ${{ runner.temp }}/prepared
      - name: Publish verified development images with mandatory fresh inventory
        env:
          MODE: publish-development
          CHANNEL: development
          VERSION: ""
          DEVELOPMENT_PUBLICATION_ENABLED: ${{ vars.DEVELOPMENT_PUBLICATION_ENABLED }}
          DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          ARTIFACT_ROOT: ${{ runner.temp }}/prepared
          PUBLICATION_JOURNAL: ${{ runner.temp }}/publication-journal.json
          RECOVERY_APPROVED: "false"
        run: node tool/ci/image-publisher.mjs
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: arm64
      - name: Pull published digests and smoke-test both platforms
        env:
          DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
          PUBLICATION_JOURNAL: ${{ runner.temp }}/publication-journal.json
        run: node tool/ci/verify-published-images.mjs
      - name: Preserve publication evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: publication-journal
          path: ${{ runner.temp }}/publication-journal.json
          retention-days: 90
          if-no-files-found: warn

  publish-release:
    needs: [policy, images]
    if: github.event_name == 'push' && github.ref_type == 'tag' && vars.RELEASE_PUBLICATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Required reviewers approve each version tag before this job starts; the first step
    # stops when the environment has no reviewer (GitHub creates missing ones unprotected).
    environment: release
    concurrency:
      group: image-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Require a reviewer on the release environment
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tool/ci/check-release-environment.mjs
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: prepared-*
          path: ${{ runner.temp }}/prepared
      - name: Publish verified release images with mandatory fresh inventory
        env:
          MODE: publish-release
          CHANNEL: ${{ needs.policy.outputs.channel }}
          VERSION: ${{ needs.policy.outputs.version }}
          RELEASE_PUBLICATION_ENABLED: ${{ vars.RELEASE_PUBLICATION_ENABLED }}
          DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          ARTIFACT_ROOT: ${{ runner.temp }}/prepared
          PUBLICATION_JOURNAL: ${{ runner.temp }}/publication-journal.json
          RECOVERY_APPROVED: "false"
        run: node tool/ci/image-publisher.mjs
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: arm64
      - name: Pull published digests and smoke-test both platforms
        env:
          DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
          PUBLICATION_JOURNAL: ${{ runner.temp }}/publication-journal.json
        run: node tool/ci/verify-published-images.mjs
      - name: Preserve publication evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: publication-journal
          path: ${{ runner.temp }}/publication-journal.json
          retention-days: 90
          if-no-files-found: warn
